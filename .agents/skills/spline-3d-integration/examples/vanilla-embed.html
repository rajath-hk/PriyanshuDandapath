<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spline 3D Vanilla Embed Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .hero-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 700px;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    spline-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay-ui {
      position: absolute;
      bottom: 32px;
      left: 32px;
      z-index: 10;
      pointer-events: auto;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      z-index: 5;
      transition: opacity 0.5s ease;
      font-size: 16px;
      color: #94a3b8;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- Spline Viewer Web Component -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@latest/build/spline-viewer.js"></script>
</head>
<body>

  <div class="hero-container">
    <div id="loader" class="loader">Loading Interactive 3D Scene...</div>
    
    <!-- Replace url with your production Spline URL -->
    <spline-viewer 
      id="splineViewer"
      url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"
      loading-anim-type="spinner-small-dark">
    </spline-viewer>

    <div class="overlay-ui">
      <div class="badge">Interactive 3D Demo</div>
      <h1 class="title">Interactive Real-time Visuals</h1>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('splineViewer');
    const loader = document.getElementById('loader');

    // Hide loader once scene emits load
    viewer.addEventListener('load', () => {
      loader.classList.add('hidden');
      console.log('Spline scene successfully loaded!');
    });
  </script>
</body>
</html>
